<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1E8A9E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E8A9E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FC3D6"/>
      <stop offset="1" stop-color="#1E8A9E"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A983EC"/>
      <stop offset="1" stop-color="#8A5CD6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBF2"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#B9C4CF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Base tile (macOS grid: 824 px tile inside 1024 canvas) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- History stack: purple snippet card behind, teal clip card, paper in front -->
  <g filter="url(#shadow)">
    <rect x="300" y="270" width="380" height="470" rx="48" fill="url(#purple)" transform="rotate(-11 490 505)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="265" width="380" height="470" rx="48" fill="url(#teal)" transform="rotate(6 520 500)"/>
  </g>

  <!-- Front: clipboard -->
  <g filter="url(#shadow)">
    <rect x="322" y="300" width="380" height="490" rx="50" fill="url(#paper)"/>
  </g>
  <!-- clip -->
  <g filter="url(#shadow)">
    <path d="M432 262 h160 a28 28 0 0 1 28 28 v58 a16 16 0 0 1 -16 16 h-184 a16 16 0 0 1 -16 -16 v-58 a28 28 0 0 1 28 -28 z" fill="url(#clip)"/>
  </g>
  <circle cx="512" cy="300" r="15" fill="#1B2433" opacity="0.85"/>

  <!-- Content: a chevron prompt plus text lines (paste as a dev) -->
  <path d="M386 452 l52 40 l-52 40" fill="none" stroke="#1E8A9E" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="470" y="478" width="160" height="28" rx="14" fill="#8A5CD6"/>
  <rect x="386" y="580" width="250" height="24" rx="12" fill="#C3CDD8"/>
  <rect x="386" y="636" width="190" height="24" rx="12" fill="#C3CDD8"/>
  <rect x="386" y="692" width="220" height="24" rx="12" fill="#D6DEE6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
